name: "YouTube: авторизация (получить токен)"

# Один раз: Actions → «YouTube: авторизация» → Run workflow.
# Бот пришлёт в Telegram ссылку и код; после входа пришлёт токен для секрета YT_REFRESH_TOKEN.
on:
  workflow_dispatch:

jobs:
  auth:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Авторизация через код на телефоне
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
        run: python shorts/youtube_auth.py
