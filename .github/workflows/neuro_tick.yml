# Будильник бота «Нейропоток» (ai-course/bot).
#
# Render free засыпает и своего планировщика не имеет, поэтому раз в час
# GitHub дёргает /tick: бот просыпается и сам решает, кому что отправить.
# Повторный тик ничего не дублирует — каждое сообщение уходит один раз.
#
# Нужен секрет репозитория NEURO_TICK_URL (Settings → Secrets and variables
# → Actions), например: https://neuro-bot.onrender.com/tick?key=ВАШ_TICK_KEY
# Пока секрета нет — будильник молча ничего не делает.

name: "Нейропоток: тик бота"

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: neuro-bot-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Разбудить бота и запустить рассылку
        env:
          TICK_URL: ${{ secrets.NEURO_TICK_URL }}
        run: |
          if [ -z "$TICK_URL" ]; then
            echo "Секрет NEURO_TICK_URL не задан — пропускаю."
            exit 0
          fi
          curl --fail-with-body --silent --show-error \
               --retry 4 --retry-delay 20 --retry-all-errors \
               --max-time 600 "$TICK_URL"
