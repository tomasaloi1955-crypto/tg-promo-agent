name: Промо-агент (реклама каналов)

# Запуск по расписанию (время в UTC). 06:00 UTC = 11:00 в Алматы (UTC+5) / 09:00 в Москве (UTC+3).
# Поменяйте час в cron, если нужно другое время — просто отредактируйте эту строку.
on:
  schedule:
    - cron: "0 6 * * *"
  # Кнопка «Run workflow» на вкладке Actions — запустить вручную в любой момент:
  workflow_dispatch:

permissions:
  contents: write   # нужно, чтобы шаг ниже мог закоммитить обновлённую память

jobs:
  promo:
    runs-on: ubuntu-latest
    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установить зависимости
        run: pip install -r requirements.txt

      - name: Запустить промо-агента
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          TELETHON_SESSION: ${{ secrets.TELETHON_SESSION }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
        run: python promo.py

      - name: Сохранить память (какие чаты уже использованы)
        run: |
          git config user.name "promo-agent"
          git config user.email "promo-agent@users.noreply.github.com"
          git add promo_memory.json
          git diff --cached --quiet || git commit -m "Обновление памяти промо-агента"
          git push
